<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WordHippo Add-in</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
    button { width: 100%; padding: 10px; cursor: pointer; background: #0078d4; color: white; border: none; }
    iframe { width: 100%; height: calc(100% - 40px); border: none; }
  </style>
</head>
<body>
  <button id="searchBtn">Search Selected Word</button>
  <iframe id="hippoFrame" src="https://www.wordhippo.com/"></iframe>
  <script src="app.js"></script>
</body>
</html>
