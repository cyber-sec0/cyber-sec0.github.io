<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>WordHippo Add-in</title>
		<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
		<style>
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				display: flex;
				flex-direction: column;
				font-family: sans-serif;
				background: #fff;
			}
			#controls {
				padding: 10px;
				background: #f3f2f1;
				border-bottom: 1px solid #ccc;
				display: flex;
				flex-direction: column;
				gap: 8px;
			}
			.row {
				display: flex;
				gap: 5px;
				flex-direction: column;
			}
			input,
			select,
			button {
				padding: 8px;
				font-size: 14px;
				border: 1px solid #ccc;
				border-radius: 4px;
			}
			input {
				width: calc(100% - 18px);
			}
			select {
				width: 100%;
			}
			button {
				cursor: pointer;
				background: #0078d4;
				color: white;
				border: none;
				font-weight: bold;
				padding: 10px;
			}
			button:hover {
				background: #005a9e;
			}
			iframe {
				flex: 1;
				width: 100%;
				border: none;
				display: none;
			}
			#placeholder {
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
				color: #666;
				font-size: 14px;
				text-align: center;
				padding: 20px;
			}
			#wordFormSelect {
				display: none;
			}
		</style>
	</head>
	<body>
		<div id="controls">
			<button id="grabBtn">Grab Selected Text</button>
			<div class="row">
				<input type="text" id="wordInput" placeholder="Enter word or letters..." />
				<select id="actionSelect">
					<option value="synonyms" selected>Another word for</option>
					<option value="antonyms">Opposite of</option>
					<option value="definitions">Meaning of</option>
					<option value="rhymes">Rhymes with</option>
					<option value="sentences">Sentences with</option>
					<option value="form">Find word forms</option>
					<option value="with-friends">Words With Friends</option>
					<option value="scrabble">Scrabble</option>
					<option value="cross">Crossword / Codeword</option>
					<option value="starting-with">Words starting with</option>
					<option value="ending-with">Words ending with</option>
					<option value="containing">Words containing exactly</option>
					<option value="containing-the-letters">Words containing the letters</option>
					<option value="pronunciation">Pronounce</option>
					<option value="conjugations">Find conjugations</option>
				</select>
				<select id="wordFormSelect">
					<option value="the-plural-of">Plural of</option>
					<option value="the-singular-of">Singular of</option>
					<option value="the-past-tense-of">Past tense of</option>
					<option value="the-present-tense-of">Present tense of</option>
					<option value="the-verb-for">Verb for</option>
					<option value="the-adjective-for">Adjective for</option>
					<option value="the-adverb-for">Adverb for</option>
					<option value="the-noun-for">Noun for</option>
				</select>
				<button id="searchBtn">Search WordHippo</button>
			</div>
		</div>
		<div id="placeholder">Select a word in your document and click Grab, or type a word above and click Search.</div>
		<iframe id="hippoFrame" name="hippoFrame"></iframe>
		<script src="app.js"></script>
	</body>
</html>
