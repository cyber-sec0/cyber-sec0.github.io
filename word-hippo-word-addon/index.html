<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>WordHippo Add-in</title>
		<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
		<style>
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				display: flex;
				flex-direction: column;
				font-family: sans-serif;
			}
			#controls {
				padding: 8px;
				background: #f3f2f1;
				border-bottom: 1px solid #ccc;
				display: flex;
				flex-direction: column;
				gap: 5px;
			}
			.row {
				display: flex;
				gap: 5px;
			}
			input,
			select,
			button {
				padding: 5px;
				font-size: 14px;
			}
			input {
				flex: 1;
			}
			button {
				cursor: pointer;
				background: #0078d4;
				color: white;
				border: none;
				font-weight: bold;
			}
			button:hover {
				background: #005a9e;
			}
			iframe {
				flex: 1;
				width: 100%;
				border: none;
			}
		</style>
	</head>
	<body>
		<div id="controls">
			<div class="row">
				<button id="grabBtn">Grab Selected Text</button>
			</div>
			<div class="row">
				<input type="text" id="wordInput" placeholder="Enter word..." />
				<select id="actionSelect">
					<option value="another-word-for">Synonyms</option>
					<option value="the-opposite-of">Antonyms</option>
					<option value="the-meaning-of">Meaning</option>
					<option value="words-that-rhyme-with">Rhymes</option>
					<option value="sentences-with-the-word">Sentences</option>
				</select>
			</div>
			<div class="row">
				<button id="searchBtn">Search WordHippo</button>
			</div>
		</div>
		<iframe id="hippoFrame" src="https://www.wordhippo.com/"></iframe>
		<script src="app.js"></script>
	</body>
</html>
