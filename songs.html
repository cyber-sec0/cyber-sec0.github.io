<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    html,
    body {
        height: 100%;
        overflow: hidden;
    }
    iframe {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        border: none;
    }
    #overlay {
        width: 100%;
        height: calc(100% - 250px); /*Exposes bottom controls*/
        position: absolute;
        top: 40px;
        border: 2px solid red; /*Added border color*/
    }
    #switchBtn,
    #volBtn {
        position: fixed;
        right: 87%;
        z-index: 1000;
        padding: 12px 20px;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 14px;
        font-weight: bold;
    }
    #switchBtn {
        top: 8%;
        background: #ff0000;
        cursor: pointer;
    }
    #switchBtn:hover {
        background: #cc0000;
    }
    #volBtn {
        top: 15%;
        background: #333;
    }
</style>

<title>Youtube Switcher</title>
<link rel="icon" href="https://www.youtube.com/s/desktop/03f86491/img/favicon.ico" type="image/x-icon">
<iframe id="videoFrame" src="https://www.youtube.com/embed/X4VbdwhkE10?autoplay=1&enablejsapi=1" allow="microphone; autoplay; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe>
<div id="overlay"></div>
<button id="switchBtn">Switch Video</button>
<button id="volBtn">Volume: 0%</button>

<script>
    let currentVideo = 1; //1 = jfK video, 2 = mtX video

    window.scheduleMidnight = () => setTimeout(() => {
        if (new Date().getDay() === 0 && currentVideo === 1) {
            window.ytPlayer?.loadVideoById('mtXASss7EY0'); //名曲J-POPオルゴールメドレー - Relaxing Music Box 24/7 Live - 睡眠用BGM, 安眠用BGM, 快眠用BGM
            currentVideo = 2;
        } else if (new Date().getDay() !== 0 && currentVideo === 2) {
            window.ytPlayer?.loadVideoById('X4VbdwhkE10');
            currentVideo = 1;
        }
        window.scheduleMidnight();
    }, new Date().setHours(24, 0, 0, 0) - new Date().getTime());

    window.onload = () => {
        if (new Date().getDay() === 0) {
            document.getElementById('videoFrame').src = 'https://www.youtube.com/embed/mtXASss7EY0?autoplay=1&enablejsapi=1';
            currentVideo = 2;
        }

        document.body.appendChild(Object.assign(document.createElement('script'), { src: 'https://www.youtube.com/iframe_api' }));

        document.getElementById('switchBtn').onclick = () => {
            if (currentVideo === 1) {
                window.ytPlayer?.loadVideoById('mtXASss7EY0'); //名曲J-POPオルゴールメドレー - Relaxing Music Box 24/7 Live - 睡眠用BGM, 安眠用BGM, 快眠用BGM
                currentVideo = 2;
            } else {
                window.ytPlayer?.loadVideoById('X4VbdwhkE10');
                currentVideo = 1;
            }
        };

        window.scheduleMidnight();
    };

    window.onYouTubeIframeAPIReady = () => {
        window.ytPlayer = new YT.Player('videoFrame', {
            events: {
                onReady: () => {
                    document.getElementById('volBtn').innerText = `Volume: ${window.ytPlayer?.getVolume() || 0}%`;
                },
            },
        });
    };

    document.getElementById('overlay').onwheel = (e) => {
        window.vol = Math.max(0, Math.min(100, (window.vol ?? window.ytPlayer.getVolume()) + (e.deltaY < 0 ? 5 : -5)));
        window.ytPlayer?.setVolume(window.vol);
        document.getElementById('volBtn').innerText = `Volume: ${window.vol}%`;
    };

    document.getElementById('overlay').onclick = () => {
        window.ytPlayer?.getPlayerState() === 1 ? window.ytPlayer.pauseVideo() : window.ytPlayer?.playVideo();
    };
</script>
