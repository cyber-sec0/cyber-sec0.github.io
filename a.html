<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>YouTube Switcher</title>
		<link rel="icon" href="https://www.youtube.com/s/desktop/03f86491/img/favicon.ico" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				height: 100%;
				overflow: hidden;
			}

			iframe {
				width: 100%;
				height: 100%;
				border: none;
			}
			#switchBtn,
			#volBtn {
				position: fixed;
				right: 87%;
				z-index: 1000;
				padding: 12px 20px;
				color: white;
				border: none;
				border-radius: 5px;
				font-size: 14px;
				font-weight: bold;
			}
			#switchBtn {
				top: 8%;
				background: #ff0000;
				cursor: pointer;
			}
			#switchBtn:hover {
				background: #cc0000;
			}
			#volBtn {
				top: 15%;
				background: #333;
			}
		</style>
	</head>
	<body>
		<iframe id="videoFrame" src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&enablejsapi=1" allow="microphone; autoplay; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe>
		<button id="switchBtn">Switch Video</button>
		<button id="volBtn">Volume: 0%</button>
		<script>
			let currentVideo = 1; //1 = jfK video, 2 = mtX video

			window.onload = () => {
				document.body.appendChild(Object.assign(document.createElement('script'), { src: 'https://www.youtube.com/iframe_api' }));

				document.getElementById('switchBtn').onclick = () => {
					if (currentVideo === 1) {
						window.ytPlayer?.loadVideoById('mtXASss7EY0'); //名曲J-POPオルゴールメドレー - Relaxing Music Box 24/7 Live - 睡眠用BGM, 安眠用BGM, 快眠用BGM
						currentVideo = 2;
					} else {
						window.ytPlayer?.loadVideoById('jfKfPfyJRdk');
						currentVideo = 1;
					}
				};
			};

			window.onYouTubeIframeAPIReady = () => {
				window.ytPlayer = new YT.Player('videoFrame', {
					events: {
						onReady: () =>
							setInterval(() => {
								document.getElementById('volBtn').innerText = `Volume: ${window.ytPlayer.getVolume()}%`;
							}, 500),
					},
				});
			};
		</script>
	</body>
</html>
